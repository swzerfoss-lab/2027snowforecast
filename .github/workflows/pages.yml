name: Snowcast daily check and deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 14 * * *"   # daily, ~9 AM Eastern: log today's forecast, score past ones, refresh calibration
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: snowcast
  cancel-in-progress: false
jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Forecast vs measured snow
        if: github.event_name != 'push'
        run: |
          pip install pandas numpy
          cd pipeline && python verify.py
      - name: Save the forecast log and calibration
        if: github.event_name != 'push'
        run: |
          git config user.name "snowcast-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forecast_log.csv data/obs_recent app/calibration.json
          git diff --cached --quiet || git commit -m "Daily forecast check $(date -u +%F)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
